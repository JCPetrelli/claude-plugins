name: sync

# Keeps .claude-plugin/marketplace.json and the README table in step with the latest release of each tool.
on:
  schedule:
    - cron: "17 5 * * *"   # every day, 05:17 UTC
  workflow_dispatch:
  push:
    paths: ["plugins.json", "scripts/sync.py", ".github/workflows/sync.yml"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update from the tool repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync.py
      - name: Validate the marketplace file
        run: |
          python3 - <<'EOF'
          import json
          m = json.load(open(".claude-plugin/marketplace.json"))
          assert m["name"] and m["owner"]["name"] and m["plugins"], "missing name, owner or plugins"
          for p in m["plugins"]:
              assert p["name"] and p["source"]["repo"], p
          print(f"{len(m['plugins'])} plugins OK")
          EOF
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then echo "nothing to update"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json README.md
          git commit -m "Sync plugin versions"
          git push
